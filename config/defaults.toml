# The generator inserts project_id and name and applies --timezone. This file is
# package input; it is not a Workspace marker.
format = 1
timezone = "UTC"

[paths]
metadata = ".accrete/objects"
results = "results"
memory = "memory"
tool_sources = "tools"
scratch = "scratch"

[locations.working]
kind = "filesystem"
purpose = "selected locally materialized scientific products"

# locations.working defaults to .accrete/data under the Workspace root, which the
# template's .gitignore block ignores; .accrete/local.toml can place it elsewhere.
# Model checkouts, host names, interpreters, state directories and transfer
# credentials are deliberately absent from shared defaults.
